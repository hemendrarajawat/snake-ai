name: Python Package using Conda

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Conda Path
        run: |
          echo "$CONDA/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          conda env update --file environment.yml --name base
          conda install -n base -y black flake8 pytest coverage

      - name: Check Environment
        run: |
          echo "Python version:"
          conda run -n base python --version

          echo "Conda info:"
          conda run -n base conda info

          echo "Conda list:"
          conda run -n base conda list

      - name: Check formatting with Black
        run: |
          conda run -n base black --check .

      - name: Lint with flake8
        run: |
          conda run -n base flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

          conda run -n base flake8 . \
            --count \
            --exit-zero \
            --max-complexity=10 \
            --max-line-length=127 \
            --statistics

      - name: Test with pytest and generate coverage
        run: |
          set +e
          conda run -n base coverage run -m pytest
          exit_code=$?

          if [ "$exit_code" -eq 5 ]; then
            echo "No tests discovered yet."
            exit 0
          elif [ "$exit_code" -ne 0 ]; then
            exit $exit_code
          fi

          conda run -n base coverage xml

      - name: Upload coverage report
        if: always()
        uses: orgoro/coverage@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          coverageFile: coverage.xml
