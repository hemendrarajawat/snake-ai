name: Python Package (Conda CI)

on:
  push:
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.10"
          environment-file: environment.yml
          activate-environment: base
          auto-activate-base: true
          use-mamba: true

      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: |
            ~/miniconda3/pkgs
            ~/conda_pkgs_dir
          key: conda-${{ runner.os }}-${{ hashFiles('environment.yml') }}
          restore-keys: |
            conda-${{ runner.os }}-

      - name: Show Python & Conda details
        run: |
          echo "Python version:"
          python --version

          echo "Conda info:"
          conda info

          echo "Conda list:"
          conda list

      - name: Install dev tools (black, flake8, pytest)
        run: |
          conda install -y black flake8 pytest

      - name: Format check with Black
        run: |
          black --check .

      - name: Lint with Flake8
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

          flake8 . \
            --count \
            --exit-zero \
            --max-complexity=10 \
            --max-line-length=127 \
            --statistics

      - name: Run tests with Pytest
        run: |
          set +e
          pytest
          exit_code=$?

          if [ "$exit_code" -eq 5 ]; then
            echo "No tests discovered yet."
            exit 0
          elif [ "$exit_code" -ne 0 ]; then
            exit $exit_code
          fi
